name: Temporary verify manufacturer sources for supplement candidates

on:
  push:
    branches:
      - temp/nutrition-data-collection-20260901
    paths:
      - .github/workflows/temp_verify_manufacturer_sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/nutrition-data-collection-20260901

      - name: Discover and compare manufacturer product pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf temp-results/manufacturer-source-verification/latest
          mkdir -p temp-results/manufacturer-source-verification/latest
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import math
          import pathlib
          import re
          import time
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          from collections import Counter, defaultdict
          from typing import Any

          ROOT=pathlib.Path('.')
          OUT=ROOT/'temp-results/manufacturer-source-verification/latest'
          IHP=ROOT/'temp-results/nutrition-supplement-collection/latest/product_candidates.jsonl'
          IHC=ROOT/'temp-results/nutrition-supplement-collection/latest/component_candidates.jsonl'
          CMP=ROOT/'temp-results/dsld-iherb-component-comparison/latest/product_comparison_results.jsonl'
          if not IHP.exists() or not IHC.exists():
              raise RuntimeError('iHerb collection inputs missing')

          UA='Mozilla/5.0 (compatible; EiyouNote-public-nutrition-research/1.0; +https://github.com/dcftradingcrypt/contena)'
          HEADERS={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/json,text/plain,*/*;q=0.5','Accept-Language':'en-US,en;q=0.9'}
          EXCLUDED_DOMAINS={
              'iherb.com','amazon.com','amazon.co.jp','walmart.com','ebay.com','vitacost.com','target.com',
              'reddit.com','facebook.com','instagram.com','youtube.com','tiktok.com','pinterest.com',
              'consumerlab.com','webmd.com','healthline.com','drugs.com','supplementwarehouse.com',
              'google.com','bing.com','duckduckgo.com','yahoo.com','nih.gov','fda.gov',
          }

          def sha(b:bytes)->str:return hashlib.sha256(b).hexdigest()
          def read_jsonl(path):
              return [json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          def write_jsonl(path,rows):
              with open(path,'w',encoding='utf-8',newline='\n') as f:
                  for r in rows:f.write(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          def fetch(url,max_bytes=4_000_000,timeout=45):
              req=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  body=r.read(max_bytes+1)
                  if len(body)>max_bytes:raise RuntimeError('payload too large')
                  return getattr(r,'status',200),r.geturl(),{k.lower():v for k,v in r.headers.items()},body
          def norm_text(v:Any)->str:
              s=str(v or '').casefold().replace('®',' ').replace('™',' ')
              s=re.sub(r'\b(?:tablets?|capsules?|softgels?|gummies|powder|liquid|unflavored|flavored|count|ct)\b',' ',s)
              s=re.sub(r'\b\d+(?:\.\d+)?\s*(?:mg|mcg|ug|µg|g|ml|iu|count|ct)\b',' ',s,flags=re.I)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return ' '.join(s.split())
          def tokens(v):return {x for x in norm_text(v).split() if len(x)>1}
          def sim(a,b):
              x=tokens(a);y=tokens(b)
              return len(x&y)/len(x|y) if x and y else 0.0
          def strip_tags(raw):
              raw=re.sub(r'(?is)<script[^>]*>.*?</script>',' ',raw)
              raw=re.sub(r'(?is)<style[^>]*>.*?</style>',' ',raw)
              raw=re.sub(r'(?i)<br\s*/?>','\n',raw)
              raw=re.sub(r'(?i)</(?:p|div|li|tr|td|th|h[1-6])>','\n',raw)
              raw=re.sub(r'(?s)<[^>]+>',' ',raw)
              raw=html.unescape(raw)
              raw=re.sub(r'[ \t]+',' ',raw)
              raw=re.sub(r'\n\s*\n+','\n',raw)
              return raw.strip()
          def host(url):return urllib.parse.urlsplit(url).netloc.casefold().split(':')[0].removeprefix('www.')
          def excluded(url):
              h=host(url)
              return any(h==d or h.endswith('.'+d) for d in EXCLUDED_DOMAINS)
          def brand_domain_score(brand,url):
              h=host(url).replace('-',' ').replace('.',' ')
              bt=tokens(brand)
              if not bt:return 0.0
              ht=set(h.split())
              return len(bt&ht)/len(bt)
          def ddg_results(query):
              url='https://html.duckduckgo.com/html/?'+urllib.parse.urlencode({'q':query})
              status,final,headers,body=fetch(url,max_bytes=2_000_000)
              page=body.decode('utf-8','replace')
              results=[]
              for m in re.finditer(r'(?is)<a[^>]+class=["\'][^"\']*result__a[^"\']*["\'][^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',page):
                  raw=html.unescape(m.group(1));title=strip_tags(m.group(2))
                  if 'uddg=' in raw:
                      q=urllib.parse.parse_qs(urllib.parse.urlsplit(raw).query)
                      raw=(q.get('uddg') or [raw])[0]
                  if raw.startswith('//'):raw='https:'+raw
                  if raw.startswith('http') and not excluded(raw):results.append({'url':raw,'title':title})
              return results
          robot_cache={}
          def robot_allowed(url):
              p=urllib.parse.urlsplit(url);base=f'{p.scheme}://{p.netloc}'
              if base not in robot_cache:
                  rp=urllib.robotparser.RobotFileParser();rp.set_url(base+'/robots.txt')
                  try:
                      status,final,headers,body=fetch(base+'/robots.txt',max_bytes=500_000,timeout=20)
                      rp.parse(body.decode('utf-8','replace').splitlines());robot_cache[base]=rp
                  except Exception:
                      robot_cache[base]=None
              rp=robot_cache[base]
              return rp.can_fetch(UA,url) if rp is not None else False
          def facts_excerpt(page,text):
              candidates=[]
              for pattern in (r'(?is)Supplement Facts.{0,25000}?(?:Other ingredients|Suggested use|Warnings|Disclaimer)',r'(?is)Supplement Facts.{0,18000}',r'(?is)Nutrition Facts.{0,18000}'):
                  for src in (page,text):
                      m=re.search(pattern,src)
                      if m:candidates.append(strip_tags(m.group(0)))
              return max(candidates,key=len)[:24000] if candidates else None
          AMOUNT_RE=re.compile(r'(?P<lt><\s*)?(?P<num>\d+(?:[.,]\d+)?)\s*(?P<unit>mcg|µg|ug|mg|g|IU|i\.?u\.?)\b',re.I)
          def component_candidates(excerpt):
              if not excerpt:return []
              rows=[]
              for n,line in enumerate(re.sub(r'[|•]','\n',excerpt).splitlines(),1):
                  line=re.sub(r'\s+',' ',line).strip()
                  if len(line)<3 or len(line)>500:continue
                  low=line.casefold()
                  if any(low.startswith(x) for x in ('serving size','servings per container','amount per serving','supplement facts','daily value','other ingredients','suggested use','warnings')):continue
                  m=AMOUNT_RE.search(line)
                  if not m:continue
                  name=line[:m.start()].strip(' :-*†')
                  if not name or len(name)>220:continue
                  rows.append({'line_no':n,'raw_line':line,'raw_name':name,'amount':float(m.group('num').replace(',','.')),'unit':m.group('unit'),'comparator':'<' if m.group('lt') else '='})
              return rows
          def serving(excerpt):
              if not excerpt:return {'raw':None,'quantity':None,'unit':None,'status':'not_found'}
              m=re.search(r'(?im)^\s*Serving Size\s*:?\s*(?P<qty>\d+(?:[.,]\d+)?)?\s*(?P<unit>[^\n]{1,100})$',excerpt)
              if not m:m=re.search(r'(?i)Serving Size\s*:?\s*(?P<qty>\d+(?:[.,]\d+)?)?\s*(?P<unit>[^;|]{1,100})',excerpt)
              if not m:return {'raw':None,'quantity':None,'unit':None,'status':'not_found'}
              q=m.groupdict().get('qty');u=(m.groupdict().get('unit') or '').strip(' :,-')
              return {'raw':m.group(0).strip(),'quantity':float(q.replace(',','.')) if q else None,'unit':u or None,'status':'parsed'}

          products=read_jsonl(IHP);components=read_jsonl(IHC)
          existing_comparisons=read_jsonl(CMP) if CMP.exists() else []
          independently_ok={str(r.get('iherb_product_id')) for r in existing_comparisons if r.get('comparison_status')=='independent_partial_or_full_agreement'}
          by_product=defaultdict(list)
          for c in components:by_product[str(c.get('product_id') or '')].append(c)

          # Bounded to unresolved products first; products already independently matched remain in report but are not repeatedly searched.
          targets=[p for p in products if str(p.get('product_id')) not in independently_ok][:160]
          results=[];manufacturer_components=[]
          for idx,p in enumerate(targets):
              pid=str(p.get('product_id') or '')
              brand=str(p.get('brand') or '').strip();name=str(p.get('product_name') or '').strip()
              row={'iherb_product_id':pid,'brand':brand,'product_name':name,'iherb_source_url':p.get('final_url') or p.get('source_url'),'iherb_page_sha256':p.get('page_sha256'),'search_attempts':[],'candidate_pages':[],'runtime_admission_allowed':False}
              queries=[f'"{brand}" "{name}" supplement facts official',f'"{brand}" "{name}" official']
              candidates=[]
              for q in queries:
                  try:
                      found=ddg_results(q)[:8]
                      row['search_attempts'].append({'query':q,'result_count':len(found)})
                      for result in found:
                          u=result['url'];score=0.45*brand_domain_score(brand,u)+0.35*sim(name,result['title'])+0.20*sim(brand,result['title'])
                          candidates.append({**result,'discovery_score':score})
                  except Exception as exc:
                      row['search_attempts'].append({'query':q,'error':repr(exc)})
                  time.sleep(1.0)
              # Stable unique URL order, strongest first.
              uniq={}
              for c in candidates:
                  key=urllib.parse.urlunsplit((*urllib.parse.urlsplit(c['url'])[:3],'',''))
                  if key not in uniq or c['discovery_score']>uniq[key]['discovery_score']:uniq[key]=c
              candidates=sorted(uniq.values(),key=lambda x:x['discovery_score'],reverse=True)[:5]
              for c in candidates:
                  page_row={**c,'robot_allowed':False}
                  try:
                      page_row['robot_allowed']=robot_allowed(c['url'])
                      if not page_row['robot_allowed']:
                          page_row['fetch_status']='robots_unavailable_or_disallowed';row['candidate_pages'].append(page_row);continue
                      status,final,headers,body=fetch(c['url'])
                      page=body.decode('utf-8','replace');text=strip_tags(page)
                      title_m=re.search(r'(?is)<title[^>]*>(.*?)</title>',page);title=strip_tags(title_m.group(1)) if title_m else ''
                      identity_score=max(0.25*sim(brand,title)+0.75*sim(name,title),sim(brand+' '+name,title+' '+text[:4000]))
                      excerpt=facts_excerpt(page,text);comps=component_candidates(excerpt);serv=serving(excerpt)
                      page_row.update({'fetch_status':'fetched','http_status':status,'final_url':final,'content_type':headers.get('content-type'),'page_size_bytes':len(body),'page_sha256':sha(body),'page_title':title,'identity_score':identity_score,'supplement_facts_found':bool(excerpt),'facts_excerpt_sha256':sha(excerpt.encode()) if excerpt else None,'serving':serv,'component_candidate_count':len(comps)})
                      for comp in comps:
                          comp.update({'iherb_product_id':pid,'manufacturer_source_url':final,'manufacturer_page_sha256':page_row['page_sha256'],'manufacturer_identity_score':identity_score,'runtime_admission_allowed':False})
                          manufacturer_components.append(comp)
                  except Exception as exc:
                      page_row['fetch_status']='error';page_row['error']=repr(exc)
                  row['candidate_pages'].append(page_row)
                  time.sleep(0.7)
              viable=[x for x in row['candidate_pages'] if x.get('fetch_status')=='fetched' and x.get('identity_score',0)>=0.70]
              facts=[x for x in viable if x.get('supplement_facts_found')]
              if facts:
                  best=max(facts,key=lambda x:(x.get('identity_score',0),x.get('component_candidate_count',0)))
                  row['verification_status']='manufacturer_facts_candidate_found';row['selected_candidate']=best
              elif viable:
                  best=max(viable,key=lambda x:x.get('identity_score',0));row['verification_status']='manufacturer_product_page_candidate_without_facts';row['selected_candidate']=best
              else:
                  row['verification_status']='manufacturer_source_unresolved'
              results.append(row)

          write_jsonl(OUT/'manufacturer_verification_results.jsonl',results)
          write_jsonl(OUT/'manufacturer_component_candidates.jsonl',manufacturer_components)
          summary={'target_products':len(targets),'already_independently_verified_skipped':len(independently_ok),'manufacturer_facts_candidates':sum(r['verification_status']=='manufacturer_facts_candidate_found' for r in results),'manufacturer_pages_without_facts':sum(r['verification_status']=='manufacturer_product_page_candidate_without_facts' for r in results),'manufacturer_sources_unresolved':sum(r['verification_status']=='manufacturer_source_unresolved' for r in results),'manufacturer_component_candidate_rows':len(manufacturer_components),'runtime_admission':0}
          (OUT/'verification_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Pack and commit manufacturer verification results
        shell: bash
        run: |
          set -euo pipefail
          tar -C temp-results/manufacturer-source-verification -czf temp-results/manufacturer-source-verification/latest.tar.gz latest
          sha256sum temp-results/manufacturer-source-verification/latest.tar.gz > temp-results/manufacturer-source-verification/latest.tar.gz.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add temp-results/manufacturer-source-verification
          git commit -m 'chore: record temporary manufacturer source verification' || exit 0
          git push origin HEAD:temp/nutrition-data-collection-20260901
