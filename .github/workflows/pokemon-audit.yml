name: pokemon-audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        run: |
          mkdir -p out
          echo ok > out/smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-audit-smoke
          path: out/
          if-no-files-found: error
