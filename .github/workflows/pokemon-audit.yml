name: pokemon-audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Prepare fixed work directories
        run: |
          sudo rm -rf /mnt/data/formal_inputs /mnt/data/formal_parsed /mnt/data/formal_audit_data /mnt/data/battledata_repo /mnt/data/damage_calc_repo
          sudo mkdir -p /mnt/data/formal_audit_data /mnt/data/formal_parsed
          sudo chown -R "$USER":"$USER" /mnt/data
          cp pokemon_audit/team_config_formal.json /mnt/data/formal_audit_data/team_config_formal.json
      - name: Clone mapping repository at a recorded commit
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Gheist23/pokemonbattledata.git /mnt/data/battledata_repo
          git -C /mnt/data/battledata_repo sparse-checkout set data/api
          git -C /mnt/data/battledata_repo rev-parse HEAD | tee /mnt/data/formal_audit_data/mapping_commit.txt
      - name: Capture synchronized formal snapshot
        run: |
          set -o pipefail
          PYTHONPATH=pokemon_audit python pokemon_audit/fetch_snapshot.py 2>&1 | tee /mnt/data/formal_audit_data/fetch_snapshot.log
      - name: Parse formal evidence
        run: |
          set -o pipefail
          PYTHONPATH=pokemon_audit python pokemon_audit/parse_snapshot.py 2>&1 | tee /mnt/data/formal_audit_data/parse_snapshot.log
      - name: Build one formal build per opponent
        run: |
          set -o pipefail
          PYTHONPATH=pokemon_audit python pokemon_audit/build_evidence.py 2>&1 | tee /mnt/data/formal_audit_data/build_evidence.log
      - name: Clone and build the fixed Champions damage engine
        run: |
          git clone https://github.com/smogon/damage-calc.git /mnt/data/damage_calc_repo
          git -C /mnt/data/damage_calc_repo checkout fc495808fca595479762c1b93d237a7f28254298
          git -C /mnt/data/damage_calc_repo rev-parse HEAD | tee /mnt/data/formal_audit_data/damage_engine_commit.txt
          cd /mnt/data/damage_calc_repo
          npm ci
          npm run build
      - name: Prepare corrected runtime scripts
        run: |
          python pokemon_audit/prepare_runtime_scripts.py
          node --check /mnt/data/formal_audit_data/scripts/run_ohko_state.js
          node --check /mnt/data/formal_audit_data/scripts/run_two_hit_state.js
      - name: Validate engine inputs and exact forms
        run: |
          set -o pipefail
          node pokemon_audit/validate_engine_inputs_v2.js 2>&1 | tee /mnt/data/formal_audit_data/engine_input_validation.log
      - name: Run formal one-hit scans for all 12 states
        shell: bash
        run: |
          set -euo pipefail
          STATES=(standing_archaludon standing_hippowdon standing_garchomp standing_delphox standing_dragonite standing_greninja switch_archaludon switch_hippowdon switch_garchomp switch_delphox switch_dragonite switch_greninja)
          printf '%s\n' "${STATES[@]}" | xargs -n1 -P4 node /mnt/data/formal_audit_data/scripts/run_ohko_state.js
      - name: Run formal stateful 256-path two-hit scans
        shell: bash
        run: |
          set -euo pipefail
          STATES=(standing_archaludon standing_hippowdon standing_garchomp standing_delphox standing_dragonite standing_greninja switch_archaludon switch_hippowdon switch_garchomp switch_delphox switch_dragonite switch_greninja)
          printf '%s\n' "${STATES[@]}" | xargs -n1 -P4 node /mnt/data/formal_audit_data/scripts/run_two_hit_state.js
      - name: Merge state matrices, choose switches, and validate core output
        run: |
          set -o pipefail
          python pokemon_audit/merge_results.py 2>&1 | tee /mnt/data/formal_audit_data/merge_results.log
      - name: Record repository provenance
        run: |
          git rev-parse HEAD > /mnt/data/formal_audit_data/runner_commit.txt
          cp pokemon_audit/*.py pokemon_audit/*.js pokemon_audit/*.json /mnt/data/formal_audit_data/scripts/
          find /mnt/data/formal_audit_data -maxdepth 2 -type f -printf '%p %s bytes\n' | sort | tee /mnt/data/formal_audit_data/file_inventory.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokemon-audit-core
          path: |
            /mnt/data/formal_inputs/
            /mnt/data/formal_parsed/
            /mnt/data/formal_audit_data/
          if-no-files-found: warn
          compression-level: 6
