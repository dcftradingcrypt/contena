name: pokemon-audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Prepare fixed work directories
        run: |
          sudo rm -rf /mnt/data/formal_inputs /mnt/data/formal_parsed /mnt/data/formal_audit_data /mnt/data/battledata_repo
          sudo mkdir -p /mnt/data/formal_audit_data /mnt/data/formal_parsed
          sudo chown -R "$USER":"$USER" /mnt/data
          cp pokemon_audit/team_config_formal.json /mnt/data/formal_audit_data/team_config_formal.json
      - name: Clone mapping repository at a recorded commit
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Gheist23/pokemonbattledata.git /mnt/data/battledata_repo
          git -C /mnt/data/battledata_repo sparse-checkout set data/api
          git -C /mnt/data/battledata_repo rev-parse HEAD | tee /mnt/data/formal_audit_data/mapping_commit.txt
      - name: Capture synchronized formal snapshot
        run: |
          set -o pipefail
          PYTHONPATH=pokemon_audit python pokemon_audit/fetch_snapshot.py 2>&1 | tee /mnt/data/formal_audit_data/fetch_snapshot.log
      - name: Parse formal evidence
        run: |
          set -o pipefail
          PYTHONPATH=pokemon_audit python pokemon_audit/parse_snapshot.py 2>&1 | tee /mnt/data/formal_audit_data/parse_snapshot.log
      - name: Build one formal build per opponent
        run: |
          set -o pipefail
          PYTHONPATH=pokemon_audit python pokemon_audit/build_evidence.py 2>&1 | tee /mnt/data/formal_audit_data/build_evidence.log
      - name: Show formal snapshot summary
        run: |
          cat /mnt/data/formal_inputs/formal_snapshot/snapshot_manifest.json
          python - <<'PY'
          import json
          p='/mnt/data/formal_audit_data/opponent_builds.json'
          d=json.load(open(p))
          print({'opponents':len(d['opponents']),'builds':len(d['builds']),'snapshot':d['snapshot_jst']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokemon-audit-formal-stage1
          path: |
            /mnt/data/formal_inputs/
            /mnt/data/formal_parsed/
            /mnt/data/formal_audit_data/
          if-no-files-found: warn
          compression-level: 6
